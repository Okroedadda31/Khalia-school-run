<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khalia School Run - Premium Platform Game</title>
    <style>
      :root {
        --primary: #ff6b35;
        --primary-dark: #d84315;
        --secondary: #00d4ff;
        --secondary-dark: #0099cc;
        --accent: #ffd60a;
        --accent-dark: #ffb703;
        --success: #06d6a0;
        --text: #1a1a2e;
        --text-light: #ffffff;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: 'Arial', 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f3460 0%, #16213e 50%, #0f3460 100%);
        color: var(--text);
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 0;
      }

      .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      }

      .top-bar {
        background: linear-gradient(90deg, rgba(255, 107, 53, 0.95), rgba(0, 212, 255, 0.95));
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 32px rgba(255, 107, 53, 0.4);
        border-bottom: 4px solid var(--accent);
      }

      .banner {
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: #fff;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.6), -1px -1px 2px rgba(255, 255, 255, 0.3);
        margin: 0;
      }

      .hud {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .stat {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 8px 16px;
        min-width: 110px;
        text-align: center;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }

      .stat span {
        display: block;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 4px;
        font-weight: 600;
      }

      .stat strong {
        font-size: 1.3rem;
        color: var(--accent);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .game-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .game-shell {
        position: relative;
        width: 95vw;
        height: calc(100vh - 80px);
        max-width: 1400px;
        max-height: 700px;
        background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 40%, #90ee90 60%, #7cb342 100%);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(255, 107, 53, 0.4), inset 0 -10px 30px rgba(0, 0, 0, 0.1);
        border: 6px solid #ff6b35;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(15, 52, 96, 0.7);
        backdrop-filter: blur(8px);
        transition: opacity 0.3s ease;
        z-index: 100;
      }

      .overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .modal {
        text-align: center;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 107, 53, 0.15));
        border-radius: 24px;
        padding: 40px 48px;
        box-shadow: 0 20px 60px rgba(255, 107, 53, 0.6), 0 0 60px rgba(0, 212, 255, 0.4);
        max-width: 500px;
        width: calc(100% - 40px);
        border: 4px solid var(--accent);
        backdrop-filter: blur(10px);
      }

      .modal h2 {
        margin: 0 0 16px;
        background: linear-gradient(135deg, #ff6b35, #00d4ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .modal p {
        margin: 0 0 28px;
        line-height: 1.8;
        color: #1a1a2e;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .modal button {
        border: 0;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-size: 1.1rem;
        font-weight: 800;
        padding: 16px 32px;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 12px 24px rgba(255, 107, 53, 0.4);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
      }

      .modal button:before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s ease;
      }

      .modal button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 32px rgba(255, 107, 53, 0.6);
      }

      .modal button:hover:before {
        left: 100%;
      }

      @media (max-width: 768px) {
        .top-bar {
          padding: 10px 16px;
        }

        .banner {
          font-size: 1.3rem;
        }

        .hud {
          gap: 8px;
        }

        .stat {
          min-width: 90px;
          padding: 6px 12px;
        }

        .stat strong {
          font-size: 1.1rem;
        }

        .modal {
          padding: 28px 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-bar">
        <h1 class="banner">🎮 KHALIA SCHOOL RUN 🎮</h1>
        <div class="hud">
          <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>Best</span>
            <strong id="best">0</strong>
          </div>
          <div class="stat">
            <span>Time</span>
            <strong id="time">0.0s</strong>
          </div>
        </div>
      </div>

      <div class="game-container">
        <div class="game-shell">
          <canvas id="gameCanvas"></canvas>
          <div id="overlay" class="overlay">
            <div class="modal">
              <h2>⭐ KHALIA SCHOOL RUN ⭐</h2>
              <p>Jump over obstacles and race to school! Avoid the cones to survive!</p>
              <button id="startBtn" type="button">🚀 START GAME 🚀</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const timeEl = document.getElementById('time');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');

      function resizeCanvas() {
        const shell = canvas.parentElement;
        canvas.width = shell.clientWidth;
        canvas.height = shell.clientHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const bestKey = 'khalia-school-run-best';
      let bestScore = Number(localStorage.getItem(bestKey) || 0);
      bestEl.textContent = bestScore;

      const groundHeight = canvas.height * 0.18;
      const groundY = canvas.height - groundHeight;

      const state = {
        running: false,
        score: 0,
        time: 0,
        spawnTimer: 1.0,
        lastFrame: 0,
        difficulty: 1,
        particles: [],
        player: {
          x: canvas.width * 0.12,
          y: groundY - 80,
          w: 50,
          h: 80,
          vy: 0,
          jumpPower: 850,
          color: '#ff6b35',
          isJumping: false
        },
        obstacles: [],
        clouds: [
          { x: canvas.width * 0.1, y: canvas.height * 0.15, s: 0.8, opacity: 0.9 },
          { x: canvas.width * 0.35, y: canvas.height * 0.25, s: 1.1, opacity: 0.7 },
          { x: canvas.width * 0.65, y: canvas.height * 0.12, s: 1.2, opacity: 0.8 },
          { x: canvas.width * 0.85, y: canvas.height * 0.28, s: 0.95, opacity: 0.75 }
        ]
      };

      function updateHud() {
        scoreEl.textContent = Math.floor(state.score);
        timeEl.textContent = `${state.time.toFixed(1)}s`;
        bestEl.textContent = bestScore;
      }

      function resetGame() {
        state.score = 0;
        state.time = 0;
        state.difficulty = 1;
        state.spawnTimer = 1.0;
        state.lastFrame = 0;
        state.player.y = groundY - state.player.h;
        state.player.vy = 0;
        state.player.isJumping = false;
        state.obstacles = [];
        state.particles = [];
        updateHud();
      }

      function spawnParticles(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count;
          state.particles.push({
            x, y,
            vx: Math.cos(angle) * 300,
            vy: Math.sin(angle) * 300 - 100,
            life: 0.7,
            maxLife: 0.7,
            color,
            size: 6 + Math.random() * 6
          });
        }
      }

      function startGame() {
        resetGame();
        state.running = true;
        overlay.classList.add('hidden');
        requestAnimationFrame(loop);
      }

      function endGame() {
        state.running = false;

        if (Math.floor(state.score) > bestScore) {
          bestScore = Math.floor(state.score);
          localStorage.setItem(bestKey, String(bestScore));
          spawnParticles(canvas.width / 2, canvas.height / 2, '#ffd60a', 18);
        }

        updateHud();

        const title = overlay.querySelector('h2');
        const text = overlay.querySelector('p');
        title.textContent = '💥 GAME OVER 💥';
        text.innerHTML = `<strong>Final Score: ${Math.floor(state.score)}</strong><br/>Best: ${bestScore}<br/>Time: ${state.time.toFixed(1)}s`;
        startBtn.textContent = '🔄 PLAY AGAIN';
        overlay.classList.remove('hidden');
      }

      function jump() {
        const player = state.player;
        const groundTop = groundY - player.h;
        if (!player.isJumping && player.y >= groundTop - 2) {
          player.vy = -player.jumpPower;
          player.isJumping = true;
          spawnParticles(player.x + player.w / 2, player.y + player.h, '#00d4ff', 6);
        }
      }

      function spawnObstacle() {
        const height = 28 + Math.random() * 60;
        const width = 24 + Math.random() * 18;
        const colors = ['#ff6b35', '#00d4ff', '#ffd60a', '#06d6a0', '#ff006e'];
        const color = colors[Math.floor(Math.random() * colors.length)];

        state.obstacles.push({
          x: canvas.width + 20,
          y: groundY - height,
          w: width,
          h: height,
          color
        });
      }

      function checkCollision(player, obstacle) {
        const margin = 5;
        return (
          player.x + margin < obstacle.x + obstacle.w &&
          player.x + player.w - margin > obstacle.x &&
          player.y + margin < obstacle.y + obstacle.h &&
          player.y + player.h > obstacle.y + margin
        );
      }

      function update(dt) {
        state.time += dt;
        state.score += dt * 18 * state.difficulty;
        state.difficulty = 1 + state.time / 25;

        const player = state.player;
        player.vy += 1900 * dt;
        player.y += player.vy * dt;

        const groundTop = groundY - player.h;
        if (player.y >= groundTop) {
          player.y = groundTop;
          player.vy = 0;
          player.isJumping = false;
        }

        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 1500 * dt;
          p.life -= dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }

        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnObstacle();
          state.spawnTimer = Math.max(0.5, 1.2 - state.difficulty * 0.08);
        }

        for (let i = state.obstacles.length - 1; i >= 0; i--) {
          const obstacle = state.obstacles[i];
          obstacle.x -= 430 * dt * state.difficulty;

          if (checkCollision(player, obstacle)) {
            spawnParticles(obstacle.x + obstacle.w / 2, obstacle.y + obstacle.h / 2, obstacle.color, 12);
            endGame();
            return;
          }

          if (obstacle.x + obstacle.w < 0) {
            state.obstacles.splice(i, 1);
            state.score += 25;
          }
        }

        updateHud();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, groundY);
        sky.addColorStop(0, '#87ceeb');
        sky.addColorStop(0.45, '#dff6ff');
        sky.addColorStop(0.7, '#fdf4d2');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, groundY);

        ctx.fillStyle = '#ffd60a';
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(255, 214, 10, 0.7)';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.84, canvas.height * 0.16, 42, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        for (const cloud of state.clouds) {
          ctx.fillStyle = `rgba(255,255,255,${cloud.opacity})`;
          ctx.beginPath();
          ctx.arc(cloud.x, cloud.y, 22 * cloud.s, 0, Math.PI * 2);
          ctx.arc(cloud.x + 32 * cloud.s, cloud.y - 10, 18 * cloud.s, 0, Math.PI * 2);
          ctx.arc(cloud.x + 58 * cloud.s, cloud.y, 22 * cloud.s, 0, Math.PI * 2);
          ctx.fill();
        }

        const groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
        groundGrad.addColorStop(0, '#7ecb66');
        groundGrad.addColorStop(0.5, '#5dbb63');
        groundGrad.addColorStop(1, '#33691e');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundY, canvas.width, groundHeight);

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        for (let x = 0; x < canvas.width; x += 50) {
          ctx.fillRect(x, groundY - 5, 20, 10);
        }
      }

      function drawPlayer() {
        const player = state.player;
        const x = player.x;
        const y = player.y;

        ctx.save();
        ctx.translate(x + player.w / 2, y + player.h / 2);
        if (player.vy > 100) ctx.rotate(0.06);
        ctx.translate(-(player.w / 2), -(player.h / 2));

        ctx.fillStyle = '#ff6b35';
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(0,0,0,0.28)';
        ctx.fillRect(x + 12, y + 22, 26, 38);

        ctx.fillStyle = '#f4a460';
        ctx.beginPath();
        ctx.arc(x + 25, y + 12, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x + 20, y + 8, 2.7, 0, Math.PI * 2);
        ctx.arc(x + 30, y + 8, 2.7, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x + 25, y + 13, 5, 0, Math.PI);
        ctx.stroke();

        ctx.strokeStyle = '#f4a460';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(x + 12, y + 28);
        ctx.lineTo(x + 4, y + 22);
        ctx.moveTo(x + 38, y + 28);
        ctx.lineTo(x + 46, y + 22);
        ctx.stroke();

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x + 18, y + 60);
        ctx.lineTo(x + 18, y + 78);
        ctx.moveTo(x + 32, y + 60);
        ctx.lineTo(x + 32, y + 78);
        ctx.stroke();

        ctx.restore();
      }

      function drawObstacles() {
        for (const obstacle of state.obstacles) {
          ctx.save();
          ctx.translate(obstacle.x + obstacle.w / 2, obstacle.y + obstacle.h / 2);
          ctx.fillStyle = obstacle.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.fillRect(-obstacle.w / 2, -obstacle.h / 2, obstacle.w, obstacle.h);
          ctx.fillStyle = 'rgba(255,255,255,0.32)';
          ctx.fillRect(-obstacle.w / 2 + 3, -obstacle.h / 2 + 3, obstacle.w - 6, obstacle.h / 3);
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of state.particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function draw() {
        drawBackground();
        drawObstacles();
        drawParticles();
        drawPlayer();
      }

      function loop(timestamp) {
        if (!state.running) return;
        if (!state.lastFrame) state.lastFrame = timestamp;
        const dt = Math.min((timestamp - state.lastFrame) / 1000, 0.032);
        state.lastFrame = timestamp;

        update(dt);
        draw();

        if (state.running) requestAnimationFrame(loop);
      }

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
          event.preventDefault();
          if (!state.running) startGame();
          jump();
        }
      });

      canvas.addEventListener('touchstart', (event) => {
        event.preventDefault();
        if (!state.running) startGame();
        jump();
      }, { passive: false });

      startBtn.addEventListener('click', () => startGame());

      resetGame();
      draw();
      updateHud();
    </script>
  </body>
</html>
