<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khalia School Run</title>
    <style>
      :root {
        --bg-1: #eaf3ff;
        --bg-2: #fdf7ed;
        --panel: rgba(255, 255, 255, 0.85);
        --primary: #1d4ed8;
        --primary-dark: #163ea8;
        --accent: #f59e0b;
        --accent-soft: #fde68a;
        --ground: #3e7b3f;
        --ground-dark: #2b5d2e;
        --text: #18212f;
        --muted: #53627a;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .page {
        width: min(980px, 100%);
      }

      .banner {
        text-align: center;
        font-size: clamp(1.4rem, 2vw, 2.2rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--primary-dark);
        margin-bottom: 16px;
      }

      .hud {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .stat {
        background: var(--panel);
        border: 2px solid rgba(29, 78, 216, 0.12);
        border-radius: 14px;
        padding: 10px 18px;
        min-width: 120px;
        text-align: center;
        box-shadow: 0 6px 16px rgba(22, 62, 168, 0.08);
      }

      .stat span {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .stat strong {
        font-size: 1.2rem;
        color: var(--primary-dark);
      }

      .game-shell {
        position: relative;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(23, 37, 84, 0.12);
        border: 4px solid rgba(29, 78, 216, 0.08);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: linear-gradient(#dfeeff, #f8fbff 52%, #eef9e8 52%, #dff0ca 100%);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(17, 24, 39, 0.36);
        backdrop-filter: blur(2px);
        transition: opacity 0.2s ease;
      }

      .overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .modal {
        text-align: center;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 20px;
        padding: 28px 32px;
        box-shadow: 0 18px 32px rgba(0, 0, 0, 0.12);
        max-width: 420px;
        width: calc(100% - 40px);
      }

      .modal h2 {
        margin: 0 0 10px;
        color: var(--primary-dark);
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .modal p {
        margin: 0 0 22px;
        line-height: 1.6;
        color: var(--muted);
        font-size: 1rem;
      }

      .modal button {
        border: 0;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 26px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 18px rgba(29, 78, 216, 0.25);
      }

      .modal button:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 640px) {
        body {
          padding: 14px;
        }

        .hud {
          gap: 8px;
        }

        .stat {
          min-width: 96px;
          padding: 8px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="banner">Khalia School Run</div>

      <div class="hud">
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
        <div class="stat">
          <span>Time</span>
          <strong id="time">0.0s</strong>
        </div>
      </div>

      <div class="game-shell">
        <canvas id="gameCanvas" width="900" height="420"></canvas>

        <div id="overlay" class="overlay">
          <div class="modal">
            <h2>Khalia School Run</h2>
            <p>Press start and jump over the cones to reach school safely.</p>
            <button id="startBtn" type="button">Start Run</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const timeEl = document.getElementById('time');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');

      const groundHeight = 60;
      const groundY = canvas.height - groundHeight;
      const bestKey = 'khalia-school-run-best';

      let bestScore = Number(localStorage.getItem(bestKey) || 0);
      bestEl.textContent = bestScore;

      const state = {
        running: false,
        score: 0,
        time: 0,
        spawnTimer: 1.1,
        lastFrame: 0,
        player: {
          x: 110,
          y: groundY - 56,
          w: 42,
          h: 56,
          vy: 0,
          jumpPower: 720
        },
        obstacles: [],
        clouds: [
          { x: 90, y: 70, s: 0.9 },
          { x: 280, y: 120, s: 1.1 },
          { x: 560, y: 90, s: 1.3 },
          { x: 780, y: 140, s: 0.95 }
        ]
      };

      function updateHud() {
        scoreEl.textContent = Math.floor(state.score);
        timeEl.textContent = `${state.time.toFixed(1)}s`;
        bestEl.textContent = bestScore;
      }

      function resetGame() {
        state.score = 0;
        state.time = 0;
        state.spawnTimer = 1.1;
        state.lastFrame = 0;
        state.player.y = groundY - state.player.h;
        state.player.vy = 0;
        state.obstacles = [];
        updateHud();
      }

      function startGame() {
        resetGame();
        state.running = true;
        overlay.classList.add('hidden');
        requestAnimationFrame(loop);
      }

      function endGame() {
        state.running = false;

        if (Math.floor(state.score) > bestScore) {
          bestScore = Math.floor(state.score);
          localStorage.setItem(bestKey, String(bestScore));
        }

        updateHud();

        const title = overlay.querySelector('h2');
        const text = overlay.querySelector('p');
        title.textContent = 'School run over!';
        text.textContent = `You scored ${Math.floor(state.score)} points. Try again!`;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }

      function jump() {
        const player = state.player;
        const groundTop = groundY - player.h;

        if (player.y >= groundTop - 1) {
          player.vy = -player.jumpPower;
          player.y += -2;
        }
      }

      function spawnObstacle() {
        const height = 26 + Math.random() * 54;
        const width = 22 + Math.random() * 18;
        const color = ['#ef4444', '#f59e0b', '#a855f7', '#f97316'][Math.floor(Math.random() * 4)];

        state.obstacles.push({
          x: canvas.width + 20,
          y: groundY - height,
          w: width,
          h: height,
          color
        });
      }

      function checkCollision(player, obstacle) {
        return (
          player.x < obstacle.x + obstacle.w &&
          player.x + player.w > obstacle.x &&
          player.y < obstacle.y + obstacle.h &&
          player.y + player.h > obstacle.y
        );
      }

      function update(dt) {
        state.time += dt;
        state.score += dt * 10;

        const player = state.player;
        player.vy += 1700 * dt;
        player.y += player.vy * dt;

        const groundTop = groundY - player.h;
        if (player.y >= groundTop) {
          player.y = groundTop;
          player.vy = 0;
        }

        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnObstacle();
          state.spawnTimer = 1.0 + Math.random() * 1.2;
        }

        for (let i = state.obstacles.length - 1; i >= 0; i--) {
          const obstacle = state.obstacles[i];
          obstacle.x -= 340 * dt;

          if (checkCollision(player, obstacle)) {
            endGame();
            return;
          }

          if (obstacle.x + obstacle.w < 0) {
            state.obstacles.splice(i, 1);
          }
        }

        updateHud();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#dfeeff');
        sky.addColorStop(0.55, '#f8fbff');
        sky.addColorStop(0.56, '#edf9e6');
        sky.addColorStop(1, '#dff1c8');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f4c95d';
        ctx.beginPath();
        ctx.arc(760, 70, 36, 0, Math.PI * 2);
        ctx.fill();

        for (const cloud of state.clouds) {
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath();
          ctx.arc(cloud.x, cloud.y, 18 * cloud.s, 0, Math.PI * 2);
          ctx.arc(cloud.x + 24 * cloud.s, cloud.y - 8, 16 * cloud.s, 0, Math.PI * 2);
          ctx.arc(cloud.x + 48 * cloud.s, cloud.y, 20 * cloud.s, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#d1e6b0';
        for (let i = 0; i < 12; i++) {
          const x = 30 + i * 75;
          ctx.fillRect(x, 310, 22, 60);
          ctx.beginPath();
          ctx.arc(x + 11, 300, 28, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#c9d6ea';
        ctx.fillRect(70, 210, 90, 110);
        ctx.fillRect(175, 180, 72, 140);
        ctx.fillRect(660, 200, 120, 120);

        ctx.fillStyle = '#a5b7d3';
        for (let i = 0; i < 6; i++) {
          const x = 80 + i * 26;
          ctx.fillRect(x, 220, 12, 42);
        }

        for (let i = 0; i < 8; i++) {
          const x = 665 + i * 21;
          ctx.fillRect(x, 220, 12, 42);
        }

        ctx.fillStyle = '#8fcf71';
        ctx.fillRect(0, groundY, canvas.width, groundHeight);

        ctx.fillStyle = '#6eb15f';
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.fillRect(x, groundY, 20, 8);
        }
      }

      function drawPlayer() {
        const player = state.player;
        const x = player.x;
        const y = player.y;

        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(x + 10, y + 10, 22, 26);

        ctx.fillStyle = '#f1c27d';
        ctx.beginPath();
        ctx.arc(x + 21, y + 8, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f9fafb';
        ctx.fillRect(x + 12, y + 36, 8, 18);
        ctx.fillRect(x + 23, y + 36, 8, 18);

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(x + 7, y + 18, 6, 18);
        ctx.fillRect(x + 30, y + 18, 6, 18);
      }

      function drawObstacles() {
        for (const obstacle of state.obstacles) {
          ctx.fillStyle = obstacle.color;
          ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);

          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillRect(obstacle.x + 5, obstacle.y + 6, obstacle.w - 10, 6);
          ctx.fillRect(obstacle.x + 5, obstacle.y + obstacle.h / 2 - 3, obstacle.w - 10, 6);
        }
      }

      function draw() {
        drawBackground();
        drawObstacles();
        drawPlayer();
      }

      function loop(timestamp) {
        if (!state.running) return;

        if (!state.lastFrame) state.lastFrame = timestamp;
        const dt = Math.min((timestamp - state.lastFrame) / 1000, 0.032);
        state.lastFrame = timestamp;

        update(dt);
        draw();

        if (state.running) {
          requestAnimationFrame(loop);
        }
      }

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
          event.preventDefault();
          if (!state.running) {
            startGame();
          }
          jump();
        }
      });

      startBtn.addEventListener('click', () => {
        startGame();
      });

      resetGame();
      draw();
      updateHud();
    </script>
  </body>
</html>
