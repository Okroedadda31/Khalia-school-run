<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khalia School Run</title>
    <style>
      :root {
        --bg: #f5f7ff;
        --card: #ffffff;
        --primary: #1d4ed8;
        --primary-dark: #163ea8;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #f59e0b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f9fafb);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 20px;
      }

      .card {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        padding: 40px 30px;
        text-align: center;
      }

      .tag {
        display: inline-block;
        background: #dbeafe;
        color: var(--primary-dark);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.2rem, 4vw, 4rem);
        margin: 20px 0 10px;
      }

      p {
        font-size: 1.08rem;
        color: var(--muted);
        line-height: 1.7;
        max-width: 700px;
        margin: 0 auto;
      }

      .button-row {
        margin-top: 30px;
      }

      .button {
        display: inline-block;
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 14px 24px;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.2s ease;
      }

      .button:hover {
        background: var(--primary-dark);
      }

      .button.secondary {
        background: var(--accent);
        color: #1f2937;
        margin-left: 10px;
      }

      .button.secondary:hover {
        background: #e8a40d;
      }

      @media (max-width: 600px) {
        .button.secondary {
          margin-left: 0;
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="tag">Khalia School Run</div>
        <h1>Welcome to Khalia School Run</h1>
        <p>
          This is your landing page. You can replace this content with your project details,
          school information, updates, events, or contact information.
        </p>

        <div class="button-row">
          <a class="button" href="#">Learn More</a>
          <a class="button secondary" href="#">Contact Us</a>
        </div>
      </div>
    </div>
  </body>
</html>
